}

function initClientStrip(){
 const viewport=$('client-viewport'),track=$('clients');

  viewport.style.setProperty('--strip-width',viewport.clientWidth+'px');
  width=track.firstElementChild?.getBoundingClientRect().width||0;

 };
 new ResizeObserver(sizeStrip).observe(viewport);sizeStrip();
 viewport.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hover=true});
 viewport.addEventListener('pointerleave',()=>{hover=false});

 viewport.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.button!==0)return;
  velocity=0;coasting=false;suppressClick=false;

 });

   const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;

   if(Math.abs(dx)<6)return;

  }

 },{passive:false});
 function release(e,cancelled=false){

 window.addEventListener('pointercancel',e=>release(e,true));
 viewport.addEventListener('lostpointercapture',e=>release(e,true));
 viewport.addEventListener('click',e=>{
  if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false;}
 },true);
 viewport.addEventListener('focusin',()=>{focus=true});
 viewport.addEventListener('focusout',e=>{focus=viewport.contains(e.relatedTarget)});
 viewport.addEventListener('wheel',e=>{
  const delta=e.shiftKey?(e.deltaY||e.deltaX):e.deltaX;

}

function initVideos(root){

   return;
  }
  const wrap=v.closest('.video-wrap'),button=wrap.querySelector('.video-play');
  if(!v.dataset.wired){
   v.dataset.wired='true';
   button.addEventListener('click',()=>{v.dataset.userPaused='false';if(v.error)v.load();v.play().catch(()=>{button.hidden=false})});
   wrap.querySelector('.video-retry').addEventListener('click',()=>{wrap.querySelector('.video-error').hidden=true;v.dataset.userPaused='false';v.load();v.play().catch(()=>{button.hidden=false})});
   v.addEventListener('playing',()=>{button.hidden=true;wrap.querySelector('.video-error').hidden=true});
   v.addEventListener('pause',()=>{button.hidden=false;if(v.dataset.inView==='true'&&!document.hidden)v.dataset.userPaused='true'});
   v.addEventListener('error',()=>{button.hidden=false;wrap.querySelector('.video-error').hidden=false});
   v.addEventListener('canplay',()=>tryPlay(v));
  }
  v.dataset.userPaused='false';
  if(videoObserver)videoObserver.observe(v);else{v.dataset.inView='true';tryPlay(v)}
 });
}

function route({restore=false}={}){
 projectLayoutCleanup?.();projectLayoutCleanup=null;
 stopVideos();
 const hash=location.hash||'#work';currentRoute=hash;
 const [path,query='']=hash.slice(1).split('?'),params=new URLSearchParams(query);
 let view='work',p=null;
 if(path==='history')view='history';
 else if(path.startsWith('project/')){let id='';try{id=decodeURIComponent(path.slice(8))}catch(e){}p=PROJECTS.find(p=>p.id===id);view=p?'project':'missing'}
 else if(path!=='work'&&path!=='')view='missing';
 ['work','history','project','missing'].forEach(v=>$(v+'-view').hidden=v!==view);
 ['work','history'].forEach(v=>{const active=v===(view==='history'?'history':'work');if(active)$('nav-'+v).setAttribute('aria-current','page');else $('nav-'+v).removeAttribute('aria-current')});
 document.body.dataset.view=view;
 if(view==='work'){workRoute=hash;const f=params.get('filter')||'All';renderWork(categories.includes(f)?f:'All');requestAnimationFrame(revealActiveFilter)}
 if(view==='project')renderProject(p);
 if(view!=='project')$('project-view').replaceChildren();
 if(view==='work'||view==='project')initVideos($(view+'-view'));

 document.title=view==='project'?p.brand+' — Allen Usubov':view==='history'?'History — Allen Usubov':'Allen Usubov — Art Direction & Design';
 const y=restore?(savedScroll.get(hash)||0):0;
 requestAnimationFrame(()=>{window.scrollTo({top:y,behavior:'instant'});updateScroll();if(!restore&&view==='project')$('project-view').focus({preventScroll:true})});
}
function navigate(hash,{restore=false}={}){
 savedScroll.set(currentRoute,window.scrollY);
 if(hash!==location.hash)history.pushState(null,'',hash);
 route({restore});
}
document.addEventListener('click',event=>{
 const link=event.target.closest('a[href^="#"]');
 if(!link||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
 if(link.getAttribute('href')==='#main'){event.preventDefault();$('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});return;}
 event.preventDefault();const hash=link.getAttribute('href');navigate(hash,{restore:hash.startsWith('#work')&&currentRoute.startsWith('#project/')});
});
$('filters').addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(!button)return;const f=button.dataset.filter,y=window.scrollY,x=$('filters').scrollLeft;navigate(f==='All'?'#work':'#work?filter='+encodeURIComponent(f));$('filters').scrollLeft=x;const active=[...$('filters').querySelectorAll('button')].find(b=>b.dataset.filter===f);active?.focus({preventScroll:true});requestAnimationFrame(()=>window.scrollTo({top:Math.max(0,Math.min(y,$('projects').offsetTop-100)),behavior:'instant'}))});

$('experience').addEventListener('click',event=>{const button=event.target.closest('.job-toggle');if(!button)return;const body=$(button.getAttribute('aria-controls')),open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));button.querySelector('.job-plus').textContent=open?'−':'+';body.setAttribute('aria-hidden',String(!open));body.classList.toggle('is-open',open);body.style.maxHeight=open?body.scrollHeight+'px':'0px'});
const resizeObserver=new ResizeObserver(()=>document.querySelectorAll('.job-body.is-open').forEach(body=>body.style.maxHeight=body.scrollHeight+'px'));
resizeObserver.observe(document.documentElement);
function updateScroll(){ $('back-top').classList.toggle('visible',window.scrollY>300) }
window.addEventListener('scroll',updateScroll,{passive:true});window.addEventListener('touchmove',updateScroll,{passive:true});
$('back-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:reducedMotion.matches?'instant':'smooth'}));
window.addEventListener('popstate',()=>{savedScroll.set(currentRoute,window.scrollY);route({restore:true})});
window.addEventListener('hashchange',()=>{if((location.hash||'#work')!==currentRoute){savedScroll.set(currentRoute,window.scrollY);route({restore:true})}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)document.querySelectorAll('video').forEach(v=>v.pause());else document.querySelectorAll('video').forEach(v=>{const r=v.getBoundingClientRect();if(!v.closest('[hidden]')&&r.bottom>0&&r.top<innerHeight&&!reducedMotion.matches&&v.dataset.userPaused!=='true')v.play().catch(()=>{})})});
document.addEventListener('error',event=>{const el=event.target;if(el.tagName!=='IMG')return;const wrapper=el.closest('.cover,.gallery-media,.next-image');if(wrapper){wrapper.classList.add('media-failed');wrapper.textContent='Media unavailable';}},true);
$('year').textContent=new Date().getFullYear();renderHistory();renderClients();initClientStrip();route();
</script>
</body>
